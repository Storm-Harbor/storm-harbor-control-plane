site_name: Storm Harbor Control Plane
site_description: Continuous recovery readiness for Terraform, Google Cloud, Kubernetes and GitOps
site_url: https://storm-harbor.github.io/storm-harbor-control-plane/
repo_url: https://github.com/Storm-Harbor/storm-harbor-control-plane
repo_name: Storm-Harbor/storm-harbor-control-plane
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  custom_dir: docs/overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Open Sans
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: storm-harbor-light
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Use dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: storm-harbor-dark
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Use light theme
  features:
    - announce.dismiss
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.path
    - navigation.prune
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

nav:
  - Overview:
      - Home: index.md
      - Product: product/overview.md
      - Glossary: product/glossary.md
  - Architecture:
      - Control plane: architecture/control-plane.md
      - Federated Source of Truth: architecture/federated-source-of-truth.md
      - Inventory and dependencies: architecture/inventory.md
      - AI providers: architecture/ai-providers.md
      - Security: architecture/security.md
  - Kubernetes:
      - CRDs and Operator: kubernetes/crds-and-operator.md
  - Operations:
      - Simulation pipelines: operations/pipelines.md
      - RTO, RPO, and evidence: operations/evidence.md
      - Configuration: configuration.md
  - Evolution:
      - Roadmap: roadmap.md
      - About the project: about.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: joint
          class: joint-diagram-source
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang:
        - en
  - minify:
      minify_html: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/@joint/core@4.3.0/dist/joint.js
  - javascripts/joint-diagrams.js
  - javascripts/navigation-toggle.js

extra:
  generator: false
  brand_by: by iot.Erax
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Storm-Harbor/storm-harbor-control-plane
      name: GitHub repository
  status:
    simulation: Safe simulation

copyright: Storm Harbor Control Plane documentation · by iot.Erax
